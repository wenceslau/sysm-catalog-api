elasticsearch:
  connection-timeout: 250
  socket-timeout: 1_000

graphql:
  graphiql: false

kafka:
  auto-create-topics: false
  pool-timeout: 1_000
  consumers:
    categories:
      auto-offset-reset: earliest
      concurrency: 1
      id: kafka-listener-categories
      topics: adm_videos_mysql.adm_videos.categories
      group-id: catalogo-service
      max-attempts: 4
    cast-members:
      auto-offset-reset: earliest
      concurrency: 1
      id: kafka-listener-castmembers
      topics: adm_videos_mysql.adm_videos.cast_members
      group-id: catalogo-service
      max-attempts: 4
    genres:
      auto-offset-reset: earliest
      concurrency: 1
      id: kafka-listener-genres
      topics: adm_videos_mysql.adm_videos.genres
      group-id: catalogo-service
      max-attempts: 4
    videos:
      auto-offset-reset: earliest
      concurrency: 1
      id: kafka-listener-videos
      topics: adm_videos_mysql.adm_videos.videos
      group-id: catalogo-service
      max-attempts: 4

server:
  port: ${web-server.port}
  servlet:
      context-path: ${web-server.context_path}
  compression:
    enabled: true                                           # Whether response compression is enabled.
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json # Comma-separated list of MIME types that should be compressed.
    min-response-size: 1024                                 # Minimum "Content-Length" value that is required for compression to be performed.
  undertow:
    threads:
      worker: ${web-server.undertow_threads_worker}           # Generally this should be reasonably high, at least 10 per CPU core: https://undertow.io/undertow-docs/undertow-docs-2.1.0/index.html#listeners-2
      io: ${web-server.undertow_threads_io}                     # One IO thread per CPU core is a reasonable default: https://undertow.io/undertow-docs/undertow-docs-2.1.0/index.html#listeners-2

spring:
  elasticsearch:
    uris: ${elasticsearch.uris}
    username: ${elasticsearch.username}
    password: ${elasticsearch.password}
    socket-timeout: ${elasticsearch.socket-timeout}
    connection-timeout: ${elasticsearch.connection-timeout}

  graphql:
    graphiql:
      enabled: ${graphql.graphiql}
  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 100GB
  security:
    oauth2:
      resourceserver:
        jwt:
          # Spring on start get the Keycloak public certificates and put it in cache,
          # and each request check if the token is signed and its signature match to the public certificate
          jwk-set-uri: ${keycloak.host}/realms/${keycloak.realm}/protocol/openid-connect/certs # url to get the public certificates
          issuer-uri:  ${keycloak.host}/realms/${keycloak.realm}

logging:
  level:
    root: ${log.level_root}
